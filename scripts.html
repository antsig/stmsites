let appState = {
  settings: Object.assign({}, DEFAULT_SETTINGS),
  materials: [],
  currentAdminPin: "123456",
  selectedCategory: "",
  selectedGrade: "",
  selectedMediaType: "",
  searchQuery: "",
  isAdminLoggedIn: false,
  pendingCategory: "",
  isGradeLocked: false
};

window.addEventListener("DOMContentLoaded", () => {
  loadInitialData();
});

function isRunningInGoogleAppsScript() {
  return typeof google !== "undefined" && google.script && google.script.run;
}

function loadInitialData() {
  if (isRunningInGoogleAppsScript()) {
    google.script.run
      .withSuccessHandler((response) => {
        if (response && response.success) {
          appState.settings = Object.assign({}, DEFAULT_SETTINGS, response.data.settings);
          appState.materials = response.data.materials || [];
        } else {
          fallbackToLocalStorage();
        }
        renderApp();
      })
      .withFailureHandler(() => {
        fallbackToLocalStorage();
        renderApp();
      })
      .getInitialData();
  } else {
    fallbackToLocalStorage();
    renderApp();
  }
}

function fallbackToLocalStorage() {
  const DATA_VERSION = "v1.5.0";
  const currentVersion = localStorage.getItem("stem_data_version");
  const savedSettings = localStorage.getItem("stem_settings");
  const savedMaterials = localStorage.getItem("stem_materials");
  const savedPin = localStorage.getItem("stem_admin_pin");

  appState.settings = savedSettings ? JSON.parse(savedSettings) : Object.assign({}, DEFAULT_SETTINGS);

  if (currentVersion !== DATA_VERSION) {
    appState.materials = JSON.parse(JSON.stringify(INITIAL_MATERIALS));
    localStorage.setItem("stem_materials", JSON.stringify(appState.materials));
    localStorage.setItem("stem_data_version", DATA_VERSION);
  } else {
    appState.materials = savedMaterials ? JSON.parse(savedMaterials) : JSON.parse(JSON.stringify(INITIAL_MATERIALS));
  }

  appState.currentAdminPin = savedPin || "123456";
}

function saveToLocalStorage() {
  localStorage.setItem("stem_settings", JSON.stringify(appState.settings));
  localStorage.setItem("stem_materials", JSON.stringify(appState.materials));
  localStorage.setItem("stem_admin_pin", appState.currentAdminPin);
}

function renderApp() {
  renderSchoolIdentity();
  renderCategoryLogosAndCounts();

  const homeView = document.getElementById("viewHome");
  const subCategoryView = document.getElementById("viewCategorySub");

  if (!appState.selectedCategory) {
    if (homeView) homeView.style.display = "block";
    if (subCategoryView) subCategoryView.style.display = "none";
  } else {
    if (homeView) homeView.style.display = "none";
    if (subCategoryView) subCategoryView.style.display = "block";
    renderCategorySubpageHeader();
    updateGradeFilterBarVisibility();
    renderMaterialsGrid();
    renderActiveFilterStatus();
  }
}

function renderSchoolIdentity() {
  const s = appState.settings;
  const logoEl = document.getElementById("navSchoolLogo");
  const navTitleEl = document.getElementById("navSchoolName");
  const heroTitleEl = document.getElementById("heroSchoolName");
  const heroYearEl = document.getElementById("heroAcademicYear");
  const heroSloganEl = document.getElementById("heroSlogan");

  if (logoEl && s.logo_url) logoEl.src = s.logo_url;
  if (navTitleEl) navTitleEl.textContent = s.school_name || "SD NEGERI HARAPAN BANGSA";
  if (heroTitleEl) heroTitleEl.textContent = s.school_name || "SD NEGERI HARAPAN BANGSA";
  if (heroYearEl) heroYearEl.textContent = s.academic_year || "2026/2027";
  if (heroSloganEl) heroSloganEl.textContent = s.slogan || "Eksplorasi Sains, Teknologi, Rekayasa, dan Matematika!";

  // Footer Resmi Sekolah (Kontak WA Langsung Nomor & Hak Cipta)
  const footerSchoolBottom = document.getElementById("footerSchoolNameBottom");
  const footerWaLink = document.getElementById("footerWaLink");
  const footerWaText = document.getElementById("footerWaText");

  if (footerSchoolBottom) footerSchoolBottom.textContent = s.school_name || "SD NEGERI HARAPAN BANGSA";

  if (footerWaLink && footerWaText) {
    const rawWa = (s.contact_wa || "081234567890").trim();
    const cleanDigits = rawWa.replace(/\D/g, "");
    let waLinkNum = cleanDigits;
    if (waLinkNum.startsWith("0")) {
      waLinkNum = "62" + waLinkNum.slice(1);
    }
    footerWaLink.href = `https://wa.me/${waLinkNum}`;

    // Tampilkan langsung nomor telepon tanpa teks awalan
    let displayWa = rawWa;
    if (!displayWa.startsWith("+") && !displayWa.startsWith("0")) {
      displayWa = "+" + displayWa;
    }
    footerWaText.textContent = displayWa;
  }
}

function renderCategoryLogosAndCounts() {
  const counts = { Science: 0, Technology: 0, Engineering: 0, Mathematics: 0 };
  appState.materials.forEach((m) => {
    if (counts[m.stem_category] !== undefined) {
      counts[m.stem_category]++;
    }
  });

  for (const cat in counts) {
    const countEl = document.getElementById(`count-${cat}`);
    if (countEl) countEl.textContent = `${counts[cat]} Materi`;

    const iconBox = document.getElementById(`icon-box-${cat}`);
    if (iconBox) {
      const customLogo = appState.settings[`logo_${cat.toLowerCase()}`];
      if (customLogo) {
        iconBox.innerHTML = `<img src="${escapeHtml(customLogo)}" class="stem-icon-img" alt="${cat}" onerror="renderDefaultIcon(this, '${cat}')">`;
      } else {
        iconBox.innerHTML = getDefaultCategoryIcon(cat);
      }
    }
  }
}

function getDefaultCategoryIcon(category) {
  switch (category) {
    case "Science": return '<i class="fa-solid fa-flask-vial"></i>';
    case "Technology": return '<i class="fa-solid fa-laptop-code"></i>';
    case "Engineering": return '<i class="fa-solid fa-gears"></i>';
    case "Mathematics": return '<i class="fa-solid fa-calculator"></i>';
    default: return '<i class="fa-solid fa-shapes"></i>';
  }
}

function renderDefaultIcon(imgEl, cat) {
  if (imgEl && imgEl.parentElement) {
    imgEl.parentElement.innerHTML = getDefaultCategoryIcon(cat);
  }
}

function openGradeSelector(category) {
  appState.pendingCategory = category;
  const nameEl = document.getElementById("gradeSelectorCategoryName");
  const badgeEl = document.getElementById("gradeSelectorBadge");
  const colorMap = {
    Science: "var(--stem-sci)",
    Technology: "var(--stem-tec)",
    Engineering: "var(--stem-eng)",
    Mathematics: "var(--stem-mat)"
  };

  if (nameEl) nameEl.textContent = `Eksplorasi ${category}`;
  if (badgeEl) {
    badgeEl.style.background = colorMap[category] || "var(--primary)";
    const customLogo = appState.settings[`logo_${category.toLowerCase()}`];
    if (customLogo) {
      badgeEl.innerHTML = `<img src="${escapeHtml(customLogo)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;" alt="${category}">`;
    } else {
      badgeEl.innerHTML = getDefaultCategoryIcon(category);
    }
  }

  const modal = document.getElementById("gradeSelectorModal");
  if (modal) modal.classList.add("open");
}

function closeGradeSelectorModal() {
  const modal = document.getElementById("gradeSelectorModal");
  if (modal) modal.classList.remove("open");
}

function chooseGradeAndExplore(grade) {
  const cat = appState.pendingCategory || "Science";
  closeGradeSelectorModal();
  selectCategory(cat);
  if (grade) {
    appState.isGradeLocked = true;
    setGradeFilter(grade);
  } else {
    appState.isGradeLocked = false;
    setGradeFilter("");
  }
  updateGradeFilterBarVisibility();
}

function updateGradeFilterBarVisibility() {
  const bar = document.getElementById("gradeFilterBar");
  const banner = document.getElementById("lockedGradeBanner");
  const text = document.getElementById("lockedGradeText");

  if (appState.isGradeLocked && appState.selectedGrade) {
    if (bar) bar.style.display = "none";
    if (banner) banner.style.display = "flex";
    if (text) text.textContent = `Kelas ${appState.selectedGrade} SD`;
  } else {
    if (bar) bar.style.display = "flex";
    if (banner) banner.style.display = "none";
  }
}

function selectCategory(category) {
  appState.selectedCategory = category;
  appState.selectedGrade = "";
  appState.selectedMediaType = "";
  appState.searchQuery = "";

  const sInput = document.getElementById("searchInput");
  if (sInput) sInput.value = "";
  const mSelect = document.getElementById("mediaFilterSelect");
  if (mSelect) mSelect.value = "";
  document.querySelectorAll(".grade-pill").forEach((btn) => btn.classList.remove("active"));
  const allBtn = document.getElementById("grade-all");
  if (allBtn) allBtn.classList.add("active");

  renderApp();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function backToHomeCategories() {
  appState.selectedCategory = "";
  appState.selectedGrade = "";
  appState.selectedMediaType = "";
  appState.searchQuery = "";
  appState.isGradeLocked = false;
  renderApp();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderMaterialsGrid() {
  const grid = document.getElementById("materialsGrid");
  if (!grid) return;

  const filtered = getFilteredMaterials();

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-shapes"></i>
        <h3>Tidak Ada Materi yang Cocok</h3>
        <p>Cobalah mengganti kata kunci pencarian, memilih jenjang kelas lain, atau mengatur ulang filter.</p>
        <button class="nav-btn primary" onclick="resetFiltersInSubpage()">
          <i class="fa-solid fa-rotate-left"></i> Tampilkan Seluruh Materi ${appState.selectedCategory}
        </button>
      </div>
    `;
    return;
  }

  grid.innerHTML = filtered.map((item) => {
    const mediaIcon = getMediaIcon(item.media_type);
    const thumb = item.thumbnail_url || 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=600&auto=format&fit=crop&q=80';
    return `
      <div class="material-card">
        <div class="card-thumb-wrap">
          <img src="${escapeHtml(thumb)}" alt="${escapeHtml(item.title)}" class="card-thumb-img" onerror="this.src='https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=600&auto=format&fit=crop&q=80'">
          <span class="card-stem-pill ${item.stem_category}">${item.stem_category}</span>
          <span class="card-grade-pill">Kelas ${item.grade}</span>
          <span class="card-media-badge"><i class="${mediaIcon}"></i> ${item.media_type}</span>
        </div>
        <div class="card-body">
          <h4 class="card-title">${escapeHtml(item.title)}</h4>
          <p class="card-desc">${escapeHtml(item.description)}</p>
          <button class="card-explore-btn" onclick="openMissionModal('${item.id}')">
            <i class="fa-solid fa-rocket"></i> Mulai Eksplorasi
          </button>
        </div>
      </div>
    `;
  }).join("");
}

function getFilteredMaterials() {
  return appState.materials.filter((m) => {
    if (m.stem_category !== appState.selectedCategory) return false;
    if (appState.selectedGrade && String(m.grade) !== String(appState.selectedGrade)) return false;
    if (appState.selectedMediaType && m.media_type !== appState.selectedMediaType) return false;
    if (appState.searchQuery) {
      const q = appState.searchQuery.toLowerCase();
      const title = (m.title || "").toLowerCase();
      const desc = (m.description || "").toLowerCase();
      if (!title.includes(q) && !desc.includes(q)) return false;
    }
    return true;
  });
}

function renderActiveFilterStatus() {
  const container = document.getElementById("activeFilterTags");
  const resetBtn = document.getElementById("resetFilterBtn");
  if (!container) return;

  const hasExtraFilters = appState.selectedMediaType || appState.searchQuery || (!appState.isGradeLocked && appState.selectedGrade);

  if (!hasExtraFilters && (!appState.selectedGrade || appState.isGradeLocked)) {
    const totalMatching = getFilteredMaterials().length;
    if (appState.isGradeLocked) {
      container.innerHTML = `<span><i class="fa-solid fa-list-check" style="color:var(--primary);"></i> Menampilkan seluruh materi Kelas ${appState.selectedGrade} SD (${totalMatching} sub-materi)</span>`;
    } else {
      const totalInCat = appState.materials.filter(m => m.stem_category === appState.selectedCategory).length;
      container.innerHTML = `<span><i class="fa-solid fa-list-check" style="color:var(--primary);"></i> Menampilkan seluruh materi ${appState.selectedCategory} (${totalInCat} sub-materi)</span>`;
    }
    if (resetBtn) resetBtn.style.display = "none";
    return;
  }

  if (resetBtn) resetBtn.style.display = "inline-flex";

  let tagsHtml = [];
  if (appState.selectedGrade) {
    if (appState.isGradeLocked) {
      tagsHtml.push(`<span class="filter-tag" style="background:#EFF6FF; border:1px solid #BFDBFE; color:#1E3A8A; font-weight:700;"><i class="fa-solid fa-lock" style="color:var(--primary);"></i> Kelas: ${appState.selectedGrade}</span>`);
    } else {
      tagsHtml.push(`<span class="filter-tag">Kelas: ${appState.selectedGrade} <i class="fa-solid fa-xmark" onclick="setGradeFilter('')"></i></span>`);
    }
  }
  if (appState.selectedMediaType) {
    tagsHtml.push(`<span class="filter-tag">Media: ${appState.selectedMediaType} <i class="fa-solid fa-xmark" onclick="clearMediaTypeFilter()"></i></span>`);
  }
  if (appState.searchQuery) {
    tagsHtml.push(`<span class="filter-tag">Pencarian: "${escapeHtml(appState.searchQuery)}" <i class="fa-solid fa-xmark" onclick="clearSearchFilter()"></i></span>`);
  }

  container.innerHTML = tagsHtml.join(" ");
}

function getMediaIcon(mediaType) {
  switch (mediaType) {
    case "Video": return "fa-solid fa-circle-play";
    case "Simulasi": return "fa-solid fa-gamepad";
    case "Praktikum": return "fa-solid fa-flask";
    case "Dokumen": return "fa-solid fa-file-pdf";
    case "Artikel": return "fa-solid fa-newspaper";
    default: return "fa-solid fa-arrow-up-right-from-square";
  }
}

function setGradeFilter(grade) {
  appState.selectedGrade = grade;
  document.querySelectorAll(".grade-pill").forEach((btn) => btn.classList.remove("active"));
  const target = grade ? document.getElementById(`grade-${grade}`) : document.getElementById("grade-all");
  if (target) target.classList.add("active");
  renderMaterialsGrid();
  renderActiveFilterStatus();
}

function onSearchChange() {
  const input = document.getElementById("searchInput");
  appState.searchQuery = input ? input.value.trim() : "";
  renderMaterialsGrid();
  renderActiveFilterStatus();
}

function clearSearchFilter() {
  const input = document.getElementById("searchInput");
  if (input) input.value = "";
  appState.searchQuery = "";
  renderMaterialsGrid();
  renderActiveFilterStatus();
}

function onMediaFilterChange() {
  const select = document.getElementById("mediaFilterSelect");
  appState.selectedMediaType = select ? select.value : "";
  renderMaterialsGrid();
  renderActiveFilterStatus();
}

function clearMediaTypeFilter() {
  const select = document.getElementById("mediaFilterSelect");
  if (select) select.value = "";
  appState.selectedMediaType = "";
  renderMaterialsGrid();
  renderActiveFilterStatus();
}

function resetFiltersInSubpage() {
  if (!appState.isGradeLocked) {
    appState.selectedGrade = "";
    document.querySelectorAll(".grade-pill").forEach((btn) => btn.classList.remove("active"));
    const allBtn = document.getElementById("grade-all");
    if (allBtn) allBtn.classList.add("active");
  }
  appState.selectedMediaType = "";
  appState.searchQuery = "";

  const sInput = document.getElementById("searchInput");
  if (sInput) sInput.value = "";
  const mSelect = document.getElementById("mediaFilterSelect");
  if (mSelect) mSelect.value = "";

  renderMaterialsGrid();
  renderActiveFilterStatus();
}

function toggleMobileNavMenu() {
  const menu = document.getElementById("mobileNavMenu");
  if (!menu) return;
  const isShown = menu.style.display === "block" || getComputedStyle(menu).display === "block";
  menu.style.display = isShown ? "none" : "block";
}

function renderAdminTable() {
  const tbody = document.getElementById("adminTableBody");
  if (!tbody) return;

  const q = (document.getElementById("adminSearchInput")?.value || "").toLowerCase();
  const cat = document.getElementById("adminStemFilter")?.value || "";
  const gr = document.getElementById("adminGradeFilter")?.value || "";

  const filtered = appState.materials.filter((m) => {
    if (cat && m.stem_category !== cat) return false;
    if (gr && String(m.grade) !== String(gr)) return false;
    if (q && !(m.title || "").toLowerCase().includes(q)) return false;
    return true;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-muted);">Tidak ada data materi yang sesuai kriteria.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map((item) => `
    <tr>
      <td>
        <img src="${escapeHtml(item.thumbnail_url || 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=100&auto=format&fit=crop&q=80')}" alt="" style="width:48px; height:48px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid #E2E8F0;" onerror="this.src='https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=100&auto=format&fit=crop&q=80'">
      </td>
      <td>
        <strong>${escapeHtml(item.title)}</strong>
        <div style="font-size:0.75rem; color:var(--text-muted);">${escapeHtml((item.description || '').substring(0, 60))}...</div>
      </td>
      <td><span class="card-stem-pill ${item.stem_category}" style="position:static; font-size:0.7rem; padding:0.2rem 0.5rem;">${item.stem_category}</span></td>
      <td><strong>Kelas ${item.grade}</strong></td>
      <td><span class="card-media-badge" style="position:static; font-size:0.7rem;"><i class="${getMediaIcon(item.media_type)}"></i> ${item.media_type}</span></td>
      <td style="text-align:right;">
        <div class="action-btn-group" style="justify-content:flex-end;">
          <button class="btn-icon edit" title="Edit Materi" onclick="openEditMaterialModal('${item.id}')"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-icon delete" title="Hapus Materi" onclick="confirmDeleteMaterial('${item.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      </td>
    </tr>
  `).join("");
}

function submitMaterialForm() {
  const title = document.getElementById("formTitle").value.trim();
  const mediaUrl = document.getElementById("formMediaUrl").value.trim();

  if (!title) {
    showToast("Judul materi wajib diisi!", "error");
    return;
  }
  if (!mediaUrl) {
    showToast("URL Tautan media pembelajaran wajib diisi!", "error");
    return;
  }

  const id = document.getElementById("formMaterialId").value.trim();
  const materialPayload = {
    id: id || undefined,
    stem_category: document.getElementById("formStemCategory").value,
    grade: document.getElementById("formGrade").value,
    title: title,
    media_type: document.getElementById("formMediaType").value,
    media_url: mediaUrl,
    thumbnail_url: document.getElementById("formThumbnailUrl").value.trim() || 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=600&auto=format&fit=crop&q=80',
    description: document.getElementById("formDescription").value.trim(),
    mission_goals: document.getElementById("formMissionGoals").value.trim(),
    mission_steps: document.getElementById("formMissionSteps").value.trim(),
    mission_reflection: document.getElementById("formMissionReflection").value.trim()
  };

  if (isRunningInGoogleAppsScript()) {
    showToast("Menyimpan ke Google Sheets...", "success");
    google.script.run
      .withSuccessHandler((response) => {
        if (response && response.success) {
          showToast(response.message || "Materi berhasil disimpan!", "success");
          closeMaterialFormModal();
          loadInitialData();
        } else {
          showToast(response.error || "Gagal menyimpan materi", "error");
        }
      })
      .withFailureHandler((err) => {
        showToast("Error simpan GAS: " + err, "error");
      })
      .saveMaterial(materialPayload, appState.currentAdminPin);
  } else {
    if (id) {
      const idx = appState.materials.findIndex((m) => m.id === id);
      if (idx !== -1) {
        appState.materials[idx] = Object.assign({}, appState.materials[idx], materialPayload);
      }
    } else {
      materialPayload.id = "STEM-" + Math.random().toString(36).substring(2, 9).toUpperCase();
      appState.materials.unshift(materialPayload);
    }
    saveToLocalStorage();
    showToast("Materi berhasil disimpan!", "success");
    closeMaterialFormModal();
    renderAdminTable();
    renderApp();
  }
}

function confirmDeleteMaterial(id) {
  if (!confirm("Apakah Anda yakin ingin menghapus sub-card materi ini?")) return;

  if (isRunningInGoogleAppsScript()) {
    showToast("Menghapus dari Google Sheets...", "success");

  }
}

function saveSchoolSettings() {
  const name = document.getElementById("settingSchoolName").value.trim();
  const year = document.getElementById("settingAcademicYear").value.trim();
  const slogan = document.getElementById("settingSlogan").value.trim();
  const logo = document.getElementById("settingLogoUrl").value.trim();
  const wa = document.getElementById("settingContactWa").value.trim();
  const email = document.getElementById("settingContactEmail").value.trim();
  const newPin = document.getElementById("settingAdminPin").value.trim();

  const logoSci = document.getElementById("settingLogoSci").value.trim();
  const logoTec = document.getElementById("settingLogoTec").value.trim();
  const logoEng = document.getElementById("settingLogoEng").value.trim();
  const logoMat = document.getElementById("settingLogoMat").value.trim();

  const newSettingsPayload = {
    school_name: name || DEFAULT_SETTINGS.school_name,
    academic_year: year || DEFAULT_SETTINGS.academic_year,
    slogan: slogan || DEFAULT_SETTINGS.slogan,
    logo_url: logo || DEFAULT_SETTINGS.logo_url,
    contact_wa: wa || DEFAULT_SETTINGS.contact_wa,
    contact_email: email || DEFAULT_SETTINGS.contact_email,
    logo_science: logoSci,
    logo_technology: logoTec,
    logo_engineering: logoEng,
    logo_mathematics: logoMat
  };

  if (newPin) {
    if (newPin.length < 4) {
      showToast("PIN Admin minimal 4 digit!", "error");
      return;
    }
    newSettingsPayload.admin_pin = newPin;
  }

  if (isRunningInGoogleAppsScript()) {
    showToast("Menyimpan pengaturan ke Google Sheets...", "success");
    google.script.run
      .withSuccessHandler((response) => {
        if (response && response.success) {
          if (newPin) appState.currentAdminPin = newPin;
          appState.settings = Object.assign({}, appState.settings, response.data);
          showToast("Pengaturan sekolah berhasil disimpan!", "success");
          renderApp();
        } else {
          showToast(response.error || "Gagal menyimpan pengaturan", "error");
        }
      })
      .withFailureHandler((err) => {
        showToast("Error update pengaturan GAS: " + err, "error");
      })
      .updateSettings(newSettingsPayload, appState.currentAdminPin);
  } else {
    if (newPin) appState.currentAdminPin = newPin;
    appState.settings = Object.assign({}, appState.settings, newSettingsPayload);
    saveToLocalStorage();
    showToast("Pengaturan sekolah berhasil disimpan!", "success");
    renderApp();
  }
}

function getCompleteCodeGsSource() {
  return "/**\n * ==============================================================================\n * PORTAL PEMBELAJARAN STEM SEKOLAH BERBASIS GOOGLE APPS SCRIPT (GAS)\n * Backend Script - Code.gs\n * ==============================================================================\n * Dijalankan di Google Apps Script yang terhubung ke Google Sheets sebagai database.\n */\n\n// Konfigurasi Nama Sheet\nvar SHEET_SETTINGS = 'Settings';\nvar SHEET_MATERI = 'Materi';\n\n// Default PIN Admin\nvar DEFAULT_PIN = '123456';\n\n/**\n * Entry point Web App (GET Request)\n */\nfunction doGet(e) {\n  // Inisialisasi spreadsheet jika tabel belum ada\n  initDatabaseIfEmpty();\n\n  var template = HtmlService.createTemplateFromFile('index');\n  return template.evaluate()\n    .setTitle('Portal Pembelajaran STEM Sekolah')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\n}\n\n/**\n * Menyertakan file HTML parsial jika diperlukan (misal: CSS / JS terpisah)\n */\nfunction include(filename) {\n  return HtmlService.createHtmlOutputFromFile(filename).getContent();\n}\n\n/**\n * Mengambil data awal untuk klien (Settings + Daftar Materi)\n */\nfunction getInitialData() {\n  try {\n    initDatabaseIfEmpty();\n    var settings = getSettingsMap();\n    var materials = getMaterialsList();\n\n    // Sembunyikan PIN admin di respon publik\n    var safeSettings = Object.assign({}, settings);\n    delete safeSettings.admin_pin;\n\n    return {\n      success: true,\n      data: {\n        settings: safeSettings,\n        materials: materials\n      }\n    };\n  } catch (err) {\n    return {\n      success: false,\n      error: err.toString()\n    };\n  }\n}\n\n/**\n * Verifikasi PIN Admin\n */\nfunction verifyPin(inputPin) {\n  try {\n    var settings = getSettingsMap();\n    var currentPin = settings.admin_pin || DEFAULT_PIN;\n    if (String(inputPin).trim() === String(currentPin).trim()) {\n      return { success: true };\n    }\n    return { success: false, error: 'PIN Admin tidak sesuai! Silakan periksa kembali.' };\n  } catch (err) {\n    return { success: false, error: err.toString() };\n  }\n}\n\n/**\n * Menyimpan (Tambah baru atau Update) Sub-Card Materi STEM\n */\nfunction saveMaterial(materialData, adminPin) {\n  try {\n    // Validasi Keamanan PIN\n    var pinCheck = verifyPin(adminPin);\n    if (!pinCheck.success) return pinCheck;\n\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var sheet = ss.getSheetByName(SHEET_MATERI);\n    if (!sheet) {\n      initDatabaseIfEmpty();\n      sheet = ss.getSheetByName(SHEET_MATERI);\n    }\n\n    var data = sheet.getDataRange().getValues();\n    var headers = data[0];\n    var idIndex = headers.indexOf('id');\n\n    var isUpdate = false;\n    var targetRow = -1;\n\n    // Jika ID diberikan, cari baris untuk update\n    if (materialData.id) {\n      for (var i = 1; i < data.length; i++) {\n        if (String(data[i][idIndex]) === String(materialData.id)) {\n          isUpdate = true;\n          targetRow = i + 1; // 1-based row index\n          break;\n        }\n      }\n    }\n\n    var finalId = isUpdate ? materialData.id : 'STEM-' + Utilities.getUuid().substring(0, 8).toUpperCase();\n    var now = Utilities.formatDate(new Date(), 'Asia/Jakarta', 'yyyy-MM-dd HH:mm:ss');\n\n    var rowValues = [\n      finalId,\n      materialData.stem_category || 'Science',\n      materialData.title || '',\n      materialData.grade || '1',\n      materialData.media_type || 'Video',\n      materialData.media_url || '',\n      materialData.thumbnail_url || '',\n      materialData.description || '',\n      materialData.mission_goals || '',\n      materialData.mission_steps || '',\n      materialData.mission_reflection || '',\n      isUpdate ? (data[targetRow - 1][headers.indexOf('created_at')] || now) : now\n    ];\n\n    if (isUpdate && targetRow > 1) {\n      sheet.getRange(targetRow, 1, 1, rowValues.length).setValues([rowValues]);\n    } else {\n      sheet.appendRow(rowValues);\n    }\n\n    return {\n      success: true,\n      message: isUpdate ? 'Materi berhasil diperbarui!' : 'Materi baru berhasil ditambahkan!',\n      data: formatMaterialRow(headers, rowValues)\n    };\n  } catch (err) {\n    return { success: false, error: err.toString() };\n  }\n}\n\n/**\n * Menghapus Sub-Card Materi berdasarkan ID\n */\nfunction deleteMaterial(id, adminPin) {\n  try {\n    var pinCheck = verifyPin(adminPin);\n    if (!pinCheck.success) return pinCheck;\n\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var sheet = ss.getSheetByName(SHEET_MATERI);\n    if (!sheet) return { success: false, error: 'Sheet Materi tidak ditemukan!' };\n\n    var data = sheet.getDataRange().getValues();\n    var idIndex = data[0].indexOf('id');\n    var foundRow = -1;\n\n    for (var i = 1; i < data.length; i++) {\n      if (String(data[i][idIndex]) === String(id)) {\n        foundRow = i + 1;\n        break;\n      }\n    }\n\n    if (foundRow > 1) {\n      sheet.deleteRow(foundRow);\n      return { success: true, message: 'Materi berhasil dihapus!' };\n    }\n\n    return { success: false, error: 'Materi dengan ID tersebut tidak ditemukan.' };\n  } catch (err) {\n    return { success: false, error: err.toString() };\n  }\n}\n\n/**\n * Memperbarui Pengaturan Sekolah & Logo\n */\nfunction updateSettings(newSettings, adminPin) {\n  try {\n    var pinCheck = verifyPin(adminPin);\n    if (!pinCheck.success) return pinCheck;\n\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var sheet = ss.getSheetByName(SHEET_SETTINGS);\n    if (!sheet) {\n      initDatabaseIfEmpty();\n      sheet = ss.getSheetByName(SHEET_SETTINGS);\n    }\n\n    var data = sheet.getDataRange().getValues();\n    var existingKeys = {};\n    for (var i = 1; i < data.length; i++) {\n      existingKeys[data[i][0]] = i + 1;\n    }\n\n    // Perbarui key yang diberikan\n    for (var key in newSettings) {\n      if (newSettings.hasOwnProperty(key)) {\n        var val = newSettings[key];\n        if (existingKeys[key]) {\n          sheet.getRange(existingKeys[key], 2).setValue(val);\n        } else {\n          sheet.appendRow([key, val]);\n        }\n      }\n    }\n\n    var updatedSettings = getSettingsMap();\n    delete updatedSettings.admin_pin; // Jangan kirimkan PIN kembali\n\n    return {\n      success: true,\n      message: 'Pengaturan sekolah berhasil disimpan!',\n      data: updatedSettings\n    };\n  } catch (err) {\n    return { success: false, error: err.toString() };\n  }\n}\n\n/**\n * Mengambil daftar pengaturan dalam format objek Key-Value\n */\nfunction getSettingsMap() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sheet = ss.getSheetByName(SHEET_SETTINGS);\n  if (!sheet) return {};\n\n  var data = sheet.getDataRange().getValues();\n  var settings = {};\n  for (var i = 1; i < data.length; i++) {\n    var k = String(data[i][0]).trim();\n    var v = data[i][1];\n    if (k) settings[k] = v;\n  }\n  return settings;\n}\n\n/**\n * Mengambil semua materi sebagai array of objects\n */\nfunction getMaterialsList() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sheet = ss.getSheetByName(SHEET_MATERI);\n  if (!sheet) return [];\n\n  var data = sheet.getDataRange().getValues();\n  if (data.length <= 1) return [];\n\n  var headers = data[0];\n  var list = [];\n  for (var i = 1; i < data.length; i++) {\n    list.push(formatMaterialRow(headers, data[i]));\n  }\n  return list;\n}\n\n/**\n * Format baris sheet menjadi objek JSON materi\n */\nfunction formatMaterialRow(headers, row) {\n  var obj = {};\n  for (var j = 0; j < headers.length; j++) {\n    var key = headers[j];\n    var val = row[j];\n    if (key === 'grade') {\n      obj[key] = String(val);\n    } else {\n      obj[key] = val !== undefined && val !== null ? String(val) : '';\n    }\n  }\n  return obj;\n}\n\n/**\n * Inisialisasi sheet dan seed data awal jika spreadsheet masih kosong\n */\nfunction initDatabaseIfEmpty() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n\n  // 1. Inisialisasi Sheet Settings\n  var settingsSheet = ss.getSheetByName(SHEET_SETTINGS);\n  if (!settingsSheet) {\n    settingsSheet = ss.insertSheet(SHEET_SETTINGS);\n    settingsSheet.appendRow(['key', 'value']);\n    var defaultSettings = [\n      ['school_name', 'SD NEGERI HARAPAN BANGSA'],\n      ['academic_year', '2026/2027'],\n      ['slogan', 'Eksplorasi Sains, Teknologi, Rekayasa, dan Matematika Bersama!'],\n      ['logo_url', 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=150&auto=format&fit=crop&q=80'],\n      ['contact_wa', '6281234567890'],\n      ['contact_email', 'stem.harapanbangsa@sekolah.sch.id'],\n      ['admin_pin', DEFAULT_PIN],\n      ['logo_science', ''],\n      ['logo_technology', ''],\n      ['logo_engineering', ''],\n      ['logo_mathematics', '']\n    ];\n    for (var s = 0; s < defaultSettings.length; s++) {\n      settingsSheet.appendRow(defaultSettings[s]);\n    }\n    settingsSheet.getRange(1, 1, 1, 2).setFontWeight('bold').setBackground('#E2E8F0');\n  }\n\n  // 2. Inisialisasi Sheet Materi\n  var materiSheet = ss.getSheetByName(SHEET_MATERI);\n  if (!materiSheet) {\n    materiSheet = ss.insertSheet(SHEET_MATERI);\n    var materiHeaders = [\n      'id', 'stem_category', 'title', 'grade', 'media_type', 'media_url',\n      'thumbnail_url', 'description', 'mission_goals', 'mission_steps',\n      'mission_reflection', 'created_at'\n    ];\n    materiSheet.appendRow(materiHeaders);\n\n    // Seed contoh materi STEM untuk Kelas 1 s.d. 6\n    var sampleMaterials = [\n      // 1. Science\n      [\n        'STEM-SCI01', 'Science', 'Petualangan Daur Hidup Kupu-kupu', '2', 'Video',\n        'https://www.youtube.com/watch?v=O1S8WzwLPlM',\n        'https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?w=600&auto=format&fit=crop&q=80',\n        'Yuk amati metamorfosis sempurna dari telur, ulat yang rakus, kepompong tidur, hingga menjadi kupu-kupu bersayap indah!',\n        '1. Mengenal 4 tahap metamorfosis kupu-kupu.\\n2. Menjelaskan perubahan bentuk ulat hingga menjadi kupu-kupu.',\n        '1. Tonton video animasi daur hidup kupu-kupu.\\n2. Siapkan kertas origami atau plastisin.\\n3. Buatlah 4 replika tahap metamorfosis dan susun berurutan di buku gambarmu!',\n        'Mengapa ulat harus beristirahat di dalam kepompong sebelum sayapnya tumbuh indah?',\n        '2026-10-25 08:00:00'\n      ],\n      [\n        'STEM-SCI02', 'Science', 'Eksplorasi Fotosintesis: Mengapa Daun Berwarna Hijau?', '4', 'Simulasi',\n        'https://phet.colorado.edu/sims/html/molecules-and-light/latest/molecules-and-light_all.html',\n        'https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?w=600&auto=format&fit=crop&q=80',\n        'Temukan bagaimana klorofil menyerap cahaya matahari dan mengubah air serta karbon dioksida menjadi oksigen segar!',\n        '1. Menjelaskan fungsi klorofil dalam proses fotosintesis.\\n2. Mengidentifikasi peran penting tumbuhan bagi udara di bumi.',\n        '1. Ambil 2 helai daun tanaman di taman sekolah.\\n2. Tutup salah satu bagian daun dengan kertas timah selama 2 hari.\\n3. Amati perubahan warna daun saat terkena sinar matahari!',\n        'Apa yang akan terjadi pada udara di bumi jika pohon-pohon hijau berkurang?',\n        '2026-10-25 08:15:00'\n      ],\n      // 2. Technology\n      [\n        'STEM-TEC01', 'Technology', 'Logika Coding Dasar: Algoritma Robot Pembawa Pesan', '3', 'Simulasi',\n        'https://blockly.games/maze',\n        'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600&auto=format&fit=crop&q=80',\n        'Belajar logika berpikir komputasional dengan menyusun blok perintah langkah demi langkah agar robot mencapai tujuan.',\n        '1. Memahami konsep urutan perintah (sequence) dalam pemrograman.\\n2. Melatih logika pemecahan masalah secara runtut.',\n        '1. Buka simulasi labirin blok melalui tautan materi.\\n2. Pandu robot agar berhasil keluar labirin dengan perintah: Maju, Belok Kiri, Belok Kanan.\\n3. Tuliskan kode langkah terbaikmu di buku catatan!',\n        'Mengapa komputer atau robot harus diberi perintah yang sangat runtut tanpa boleh ada yang terbalik?',\n        '2026-10-25 08:30:00'\n      ],\n      [\n        'STEM-TEC02', 'Technology', 'Jelajah Internet Cerdas: Cara Mencari Fakta & Menghindari Hoaks', '5', 'Artikel',\n        'https://id.wikipedia.org/wiki/Literasi_digital',\n        'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&auto=format&fit=crop&q=80',\n        'Kiat aman berselancar di dunia maya, mengenali sumber informasi tepercaya, dan menjaga data privasi.',\n        '1. Siswa mampu membedakan informasi fakta dan berita bohong.\\n2. Mengetahui pentingnya merahasiakan password dan data pribadi.',\n        '1. Baca artikel ringkasan literasi digital.\\n2. Periksa sebuah berita online menggunakan rumus 5W+1H.\\n3. Buat kartu pengingat: 3 Langkah Cek Fakta di Internet!',\n        'Mengapa kita tidak boleh sembarangan mengklik tautan hadiah yang tidak jelas pengirimnya?',\n        '2026-10-25 08:45:00'\n      ],\n      // 3. Engineering\n      [\n        'STEM-ENG01', 'Engineering', 'Rekayasa Jembatan Kertas Kokoh Penahan Beban', '1', 'Praktikum',\n        'https://www.youtube.com/watch?v=7b7pS6X9V1g',\n        'https://images.unsplash.com/photo-1545558014-8692077e9b5c?w=600&auto=format&fit=crop&q=80',\n        'Bagaimana melipat selembar kertas biasa agar mampu menahan beban koin atau mobil mainan? Temukan rahasia struktur lipatan!',\n        '1. Mengenal konsep dasar struktur teknik (lipatan zig-zag/akordeon).\\n2. Melatih kreativitas rancang bangun dengan bahan sederhana.',\n        '1. Siapkan 3 lembar kertas HVS bekas dan 2 cangkir sebagai tiang penyangga.\\n2. Buat jembatan pertama mendatar biasa, dan jembatan kedua dengan lipatan zig-zag.\\n3. Letakkan koin satu demi satu di atas jembatan sampai roboh. Catat jembatan mana yang paling kokoh   ],\n      [\n        'STEM-MAT02', 'Mathematics', 'Detektif Sudut: Menemukan Sudut Siku-siku, Lancip, & Tumpul', '5', 'Video',\n        'https://www.youtube.com/watch?v=NVuMULQjb3o',\n        'https://images.unsplash.com/photo-1509228468518-180dd4864904?w=600&auto=format&fit=crop&q=80',\n        'Bawa penggaris busurmu dan jadilah detektif yang mencari sudut-sudut rahasia pada pintu, atap rumah, dan jam dinding!',\n        '1. Mengidentifikasi sudut siku-siku (90 derajat), lancip (<90 derajat), dan tumpul (>90 derajat).\\n2. Melatih ketelitian dalam mengamati sudut pada objek di sekitar.',\n        '1. Ambil selembar kertas origami persegi yang memiliki sudut siku-siku 90°.\\n2. Cocokkan ujung kertas pada 5 sudut benda di dalam kelas atau rumahmu.\\n3. Catat di tabel: benda mana yang memiliki sudut siku-siku, lancip, atau tumpul!',\n        'Mengapa kusen pintu dan jendela kebanyakan dirancang menggunakan sudut siku-siku?',\n        '2026-10-25 09:45:00'\n      ]\n    ];\n\n    for (var m = 0; m < sampleMaterials.length; m++) {\n      materiSheet.appendRow(sampleMaterials[m]);\n    }\n    materiSheet.getRange(1, 1, 1, materiHeaders.length).setFontWeight('bold').setBackground('#E2E8F0');\n  }\n}\n";

async function initDeployCodeViewer() {
  await selectDeployFile('Code.gs');
}

async function selectDeployFile(filename) {
  currentDeployFileName = filename;
  const meta = DEPLOY_FILE_METAS[filename] || { type: 'File', appsScriptName: filename, desc: '' };

  document.querySelectorAll('.deploy-tab-btn').forEach((btn) => {
    if (btn.textContent.includes(filename)) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  const badgeEl = document.getElementById('deployFileMetaBadge');
  if (badgeEl) {
    badgeEl.textContent = 'Tipe: ' + meta.type + ' | Nama di Apps Script: ' + meta.appsScriptName + ' (cukup ketik nama tanpa .html)';
  }

  const viewer = document.getElementById('deployCodeViewer');
  if (!viewer) return;

  if (deployFileCache[filename]) {
    viewer.value = deployFileCache[filename];
    updateDeployCharCount(viewer.value);
    return;
  }

  viewer.value = 'Memuat skrip lengkap berkas ' + filename + '...';

  let content = '';
  if (filename === 'Code.gs') {
    content = getCompleteCodeGsSource();
  } else if (isRunningInGoogleAppsScript()) {
    try {
      content = await new Promise((resolve) => {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success) resolve(res.content);
            else resolve(getLocalDomContent(filename));
          })
          .withFailureHandler(() => {
            resolve(getLocalDomContent(filename));
          })
          .getDeployFileCode(filename);
      });
    } catch (e) {
      content = getLocalDomContent(filename);
    }
  } else {
    try {
      const res = await fetch(filename);
      if (res.ok) {
        content = await res.text();
      } else {
        content = getLocalDomContent(filename);
      }
    } catch (e) {
      content = getLocalDomContent(filename);
    }
  }

  deployFileCache[filename] = content;
  viewer.value = content;
  updateDeployCharCount(content);
}

function updateDeployCharCount(text) {
  const charEl = document.getElementById('deployCodeCharCount');
  if (charEl) {
    const lines = (text || '').split('\n').length;
    const chars = (text || '').length;
    charEl.textContent = lines + ' baris • ' + chars.toLocaleString() + ' karakter';
  }
}

function getLocalDomContent(filename) {
  if (filename === 'styles.html') {
    const st = document.querySelector('style[data-gas-style="true"]') || document.querySelector('style');
    return st ? '<style>\n' + st.textContent.trim() + '\n</style>' : '<!-- styles.html -->';
  }
  if (filename === 'admin.html') {
    const adm = document.getElementById('adminModuleContainer') || document.getElementById('adminView');
    return adm ? adm.innerHTML.trim() : '<!-- admin.html -->';
  }
  if (filename === 'scripts.html') {
    const sc = document.querySelector('script:not([src])');
    return sc ? '<script>\n' + sc.textContent.trim() + '\n<' + '/script>' : '<script>// scripts.html<' + '/script>';
  }
  if (filename === 'index.html') {
    return `<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Pembelajaran STEM Sekolah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <?!= include('styles'); ?>
</head>
<body>
  <div id="adminModuleContainer">
    <?!= include('admin'); ?>
  </div>
  <?!= include('scripts'); ?>
</body>
</html>`;
  }
  return '';
}

function copyCurrentDeployCode() {
  const viewer = document.getElementById('deployCodeViewer');
  const code = viewer ? viewer.value : '';
  if (!code) {
    showToast('Tidak ada kode untuk disalin!', 'error');
    return;
  }

  navigator.clipboard.writeText(code).then(() => {
    const meta = DEPLOY_FILE_METAS[currentDeployFileName] || { appsScriptName: currentDeployFileName };
    showToast('Kode ' + meta.appsScriptName + ' (' + code.length.toLocaleString() + ' karakter) berhasil disalin! Tempelkan ke Apps Script.', 'success');

    const btnText = document.getElementById('copyDeployBtnText');
    const btnIcon = document.getElementById('copyDeployBtnIcon');
    if (btnText) btnText.textContent = 'Tersalin! ✅';
    if (btnIcon) btnIcon.className = 'fa-solid fa-check';

    setTimeout(() => {
      if (btnText) btnText.textContent = 'Salin Kode Ini';
      if (btnIcon) btnIcon.className = 'fa-solid fa-copy';
    }, 2500);
  }).catch(() => {
    if (viewer) {
      viewer.select();
      document.execCommand('copy');
      showToast('Kode berhasil disalin via seleksi teks!', 'success');
    }
  });
}

function showToast(message, type = "success") {
  const container = document.getElementById("toastContainer");
  if (!container) return;

  const toast = document.createElement("div");
  toast.className = `toast-msg ${type}`;
  toast.innerHTML = `<i class="${type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation'}"></i> <span>${escapeHtml(message)}</span>`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = "0";
    toast.style.transition = "opacity 0.3s ease";
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
